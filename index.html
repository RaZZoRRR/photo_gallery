<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Фотогалерея</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            min-height: 100%;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #111;

            color: white;

            padding: 30px;

        }


        /* =====================================
           HEADER
           ===================================== */

        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        h1 {

            margin: 0;

            font-size: 42px;

        }


        #refreshButton {

            border: none;

            padding: 14px 24px;

            border-radius: 12px;

            background: white;

            color: #111;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        #refreshButton:hover {

            background: #ddd;

        }


        #status {

            margin-bottom: 25px;

            color: #aaa;

            font-size: 18px;

        }


        /* =====================================
           GALLERY
           ===================================== */

        .gallery {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(280px, 1fr)
                );

            gap: 20px;

        }


        .photo {

            position: relative;

            aspect-ratio: 4 / 3;

            overflow: hidden;

            border-radius: 16px;

            background: #222;

            cursor: pointer;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.4);

        }


        .photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

            transition:
                transform 0.3s ease;

        }


        .photo:hover img {

            transform: scale(1.04);

        }


        .photo-name {

            position: absolute;

            left: 0;

            right: 0;

            bottom: 0;

            padding: 12px;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,0.8)
                );

            font-size: 16px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        /* =====================================
           ERROR
           ===================================== */

        .error {

            padding: 30px;

            border-radius: 15px;

            background: #351919;

            color: #ffb0b0;

            font-size: 18px;

            line-height: 1.5;

        }


        /* =====================================
           SLIDESHOW
           ===================================== */

        .slideshow {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: none;

            background: rgba(0,0,0,0.96);

        }


        .slideshow.open {

            display: block;

        }


        .slide-image {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            max-width: 92vw;

            max-height: 84vh;

            object-fit: contain;

            user-select: none;

            -webkit-user-drag: none;

        }


        /* =====================================
           CLOSE
           ===================================== */

        .close-button {

            position: absolute;

            top: 25px;

            right: 30px;

            z-index: 20;

            width: 60px;

            height: 60px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.15);

            color: white;

            font-size: 38px;

            line-height: 60px;

            padding: 0;

            cursor: pointer;

        }


        .close-button:hover {

            background:
                rgba(255,255,255,0.3);

        }


        /* =====================================
           ARROWS
           ===================================== */

        .slide-arrow {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            z-index: 10;

            width: 80px;

            height: 120px;

            border: none;

            background:
                rgba(0,0,0,0.25);

            color: white;

            font-size: 70px;

            cursor: pointer;

            opacity: 0.7;

            transition:
                opacity 0.2s ease,
                background 0.2s ease;

        }


        .slide-arrow:hover {

            opacity: 1;

            background:
                rgba(255,255,255,0.12);

        }


        .prev {

            left: 0;

        }


        .next {

            right: 0;

        }


        /* =====================================
           BOTTOM BAR
           ===================================== */

        .bottom-bar {

            position: absolute;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 20;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 25px;

            padding: 20px;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,0.85)
                );

        }


        .slide-counter {

            font-size: 22px;

            font-weight: bold;

        }


        .play-button {

            border: none;

            border-radius: 10px;

            padding: 12px 22px;

            background:
                rgba(255,255,255,0.15);

            color: white;

            font-size: 18px;

            cursor: pointer;

        }


        .play-button:hover {

            background:
                rgba(255,255,255,0.3);

        }


        .slide-title {

            position: absolute;

            left: 30px;

            bottom: 25px;

            max-width: 35vw;

            font-size: 18px;

            color: #ccc;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        /* =====================================
           4K
           ===================================== */

        @media (min-width: 2500px) {

            body {

                padding: 60px;

            }


            h1 {

                font-size: 64px;

            }


            .gallery {

                grid-template-columns:
                    repeat(
                        auto-fill,
                        minmax(420px, 1fr)
                    );

                gap: 30px;

            }


            #status {

                font-size: 24px;

            }


            .slide-arrow {

                width: 130px;

                height: 180px;

                font-size: 110px;

            }


            .close-button {

                width: 80px;

                height: 80px;

                line-height: 80px;

                font-size: 50px;

            }


            .slide-counter {

                font-size: 30px;

            }


            .play-button {

                font-size: 24px;

                padding:
                    16px 28px;

            }

        }


        /* =====================================
           MOBILE
           ===================================== */

        @media (max-width: 600px) {

            body {

                padding: 15px;

            }


            header {

                align-items:
                    flex-start;

                gap: 15px;

            }


            h1 {

                font-size: 28px;

            }


            #refreshButton {

                padding:
                    10px 14px;

                font-size: 14px;

            }


            .gallery {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;

            }


            .photo {

                border-radius: 10px;

            }


            .slide-arrow {

                width: 55px;

                font-size: 45px;

            }


            .slide-title {

                display: none;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         HEADER
         ===================================== -->

    <header>

        <h1>
            📷 Фотогалерея
        </h1>


        <button
            id="refreshButton"
            onclick="loadPhotos()"
        >
            ↻ Обновить
        </button>

    </header>


    <div id="status">
        Загружаем фотографии...
    </div>


    <!-- =====================================
         GALLERY
         ===================================== -->

    <div
        id="gallery"
        class="gallery"
    ></div>


    <!-- =====================================
         SLIDESHOW
         ===================================== -->

    <div
        id="slideshow"
        class="slideshow"
    >


        <!-- Закрыть -->

        <button
            class="close-button"
            onclick="closeSlideshow()"
        >
            ×
        </button>


        <!-- Назад -->

        <button
            class="slide-arrow prev"
            onclick="previousSlide()"
        >
            ‹
        </button>


        <!-- Фотография -->

        <img
            id="slideImage"
            class="slide-image"
            src=""
            alt=""
        >


        <!-- Вперёд -->

        <button
            class="slide-arrow next"
            onclick="nextSlide()"
        >
            ›
        </button>


        <!-- Название -->

        <div
            id="slideTitle"
            class="slide-title"
        ></div>


        <!-- Нижняя панель -->

        <div class="bottom-bar">


            <button
                id="playButton"
                class="play-button"
                onclick="toggleSlideshow()"
            >
                ⏸ Пауза
            </button>


            <div
                id="slideCounter"
                class="slide-counter"
            >
                1 / 1
            </div>


        </div>


    </div>


    <script>


        /* ==========================================
           НАСТРОЙКИ
           ========================================== */


        /*
         * ВСТАВЬ СЮДА СВОЙ API KEY
         */

        const API_KEY =
            "AIzaSyBrRHXzbSixRu_aXcUnwKQV5GaRw1lm7-Q";


        /*
         * ID папки Google Drive
         */

        const FOLDER_ID =
            "19KLh4VAK9kNxQ6fEIFyjGKw3v17le7Lw";


        /*
         * Интервал слайдшоу
         *
         * 5000 = 5 секунд
         */

        const SLIDE_INTERVAL =
            5000;


        /* ==========================================
           ПЕРЕМЕННЫЕ
           ========================================== */


        let photos = [];

        let currentSlide = 0;

        let slideshowTimer = null;

        let slideshowRunning = true;


        /* ==========================================
           ЗАГРУЗКА ФОТОГРАФИЙ
           ========================================== */


        async function loadPhotos() {


            const gallery =
                document.getElementById(
                    "gallery"
                );


            const status =
                document.getElementById(
                    "status"
                );


            gallery.innerHTML = "";


            status.textContent =
                "Загружаем фотографии...";


            try {


                const query =
                    `'${FOLDER_ID}' in parents
                    and trashed = false
                    and mimeType contains 'image/'`;


                const url =
                    "https://www.googleapis.com/drive/v3/files"
                    + "?q="
                    + encodeURIComponent(query)
                    + "&orderBy="
                    + encodeURIComponent(
                        "createdTime desc"
                    )
                    + "&pageSize=100"
                    + "&fields="
                    + encodeURIComponent(
                        "files(id,name,mimeType,createdTime)"
                    )
                    + "&key="
                    + encodeURIComponent(
                        API_KEY
                    );


                const response =
                    await fetch(url);


                if (!response.ok) {


                    const errorText =
                        await response.text();


                    throw new Error(
                        "Google Drive API: "
                        + response.status
                        + " "
                        + errorText
                    );

                }


                const data =
                    await response.json();


                photos =
                    data.files || [];


                if (
                    photos.length === 0
                ) {

                    status.textContent =
                        "В папке пока нет фотографий.";

                    return;
                }


                status.textContent =
                    `Найдено фотографий: ${photos.length}`;


                /*
                 * Создаём галерею
                 */

                photos.forEach(
                    (file, index) => {


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "photo";


                        const imageUrl =
                            `https://drive.google.com/thumbnail?id=${file.id}&sz=w1600`;


                        const img =
                            document.createElement(
                                "img"
                            );


                        img.src =
                            imageUrl;


                        img.alt =
                            file.name;


                        img.loading =
                            "lazy";


                        card.appendChild(
                            img
                        );


                        const name =
                            document.createElement(
                                "div"
                            );


                        name.className =
                            "photo-name";


                        name.textContent =
                            file.name;


                        card.appendChild(
                            name
                        );


                        /*
                         * Открываем слайдшоу
                         */

                        card.onclick =
                            function () {

                                openSlideshow(
                                    index
                                );

                            };


                        gallery.appendChild(
                            card
                        );

                    }
                );


            } catch (error) {


                console.error(
                    error
                );


                status.textContent =
                    "Ошибка загрузки";


                gallery.innerHTML = `

                    <div class="error">

                        <strong>
                            Не удалось загрузить фотографии.
                        </strong>

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                        <br><br>

                        Проверь:

                        <ul>

                            <li>
                                API key указан правильно
                            </li>

                            <li>
                                Google Drive API включён
                            </li>

                            <li>
                                API key разрешён
                                для Google Drive API
                            </li>

                            <li>
                                папка доступна по ссылке
                            </li>

                        </ul>

                    </div>

                `;

            }

        }


        /* ==========================================
           ОТКРЫТИЕ СЛАЙДШОУ
           ========================================== */


        function openSlideshow(
            index
        ) {


            if (
                photos.length === 0
            ) {
                return;
            }


            currentSlide =
                index;


            slideshowRunning =
                true;


            document
                .getElementById(
                    "slideshow"
                )
                .classList.add(
                    "open"
                );


            showSlide();


            startSlideshowTimer();


            /*
             * Пытаемся включить
             * настоящий fullscreen
             */

            const slideshow =
                document.getElementById(
                    "slideshow"
                );


            if (
                slideshow.requestFullscreen
            ) {

                slideshow
                    .requestFullscreen()
                    .catch(
                        () => {}
                    );

            }

        }


        /* ==========================================
           ПОКАЗАТЬ ФОТО
           ========================================== */


        function showSlide() {


            if (
                photos.length === 0
            ) {
                return;
            }


            const file =
                photos[currentSlide];


            const imageUrl =
                `https://drive.google.com/thumbnail?id=${file.id}&sz=w3000`;


            const image =
                document.getElementById(
                    "slideImage"
                );


            image.src =
                imageUrl;


            image.alt =
                file.name;


            document.getElementById(
                "slideTitle"
            ).textContent =
                file.name;


            document.getElementById(
                "slideCounter"
            ).textContent =
                `${currentSlide + 1} / ${photos.length}`;

        }


        /* ==========================================
           СЛЕДУЮЩАЯ
           ========================================== */


        function nextSlide() {


            if (
                photos.length === 0
            ) {
                return;
            }


            currentSlide++;


            if (
                currentSlide >=
                photos.length
            ) {

                currentSlide = 0;

            }


            showSlide();


            restartSlideshowTimer();

        }


        /* ==========================================
           ПРЕДЫДУЩАЯ
           ========================================== */


        function previousSlide() {


            if (
                photos.length === 0
            ) {
                return;
            }


            currentSlide--;


            if (
                currentSlide < 0
            ) {

                currentSlide =
                    photos.length - 1;

            }


            showSlide();


            restartSlideshowTimer();

        }


        /* ==========================================
           ЗАПУСК ТАЙМЕРА
           ========================================== */


        function startSlideshowTimer() {


            clearInterval(
                slideshowTimer
            );


            slideshowTimer =
                setInterval(
                    function () {


                        if (
                            slideshowRunning
                        ) {

                            currentSlide++;


                            if (
                                currentSlide >=
                                photos.length
                            ) {

                                currentSlide = 0;

                            }


                            showSlide();

                        }


                    },
                    SLIDE_INTERVAL
                );

        }


        /* ==========================================
           ПЕРЕЗАПУСК ТАЙМЕРА
           ========================================== */


        function restartSlideshowTimer() {


            clearInterval(
                slideshowTimer
            );


            startSlideshowTimer();

        }


        /* ==========================================
           ПАУЗА / ПРОДОЛЖЕНИЕ
           ========================================== */


        function toggleSlideshow() {


            slideshowRunning =
                !slideshowRunning;


            const button =
                document.getElementById(
                    "playButton"
                );


            if (
                slideshowRunning
            ) {

                button.textContent =
                    "⏸ Пауза";

            } else {

                button.textContent =
                    "▶ Продолжить";

            }

        }


        /* ==========================================
           ЗАКРЫТЬ
           ========================================== */


        function closeSlideshow() {


            clearInterval(
                slideshowTimer
            );


            document
                .getElementById(
                    "slideshow"
                )
                .classList.remove(
                    "open"
                );


            /*
             * Выходим из fullscreen
             */

            if (
                document.fullscreenElement
            ) {

                document
                    .exitFullscreen()
                    .catch(
                        () => {}
                    );

            }

        }


        /* ==========================================
           КЛАВИАТУРА
           ========================================== */


        document.addEventListener(
            "keydown",
            function(event) {


                const slideshow =
                    document.getElementById(
                        "slideshow"
                    );


                if (
                    !slideshow.classList.contains(
                        "open"
                    )
                ) {

                    return;

                }


                switch (
                    event.key
                ) {


                    case "ArrowRight":

                        nextSlide();

                        break;


                    case "ArrowLeft":

                        previousSlide();

                        break;


                    case " ":

                        event.preventDefault();

                        toggleSlideshow();

                        break;


                    case "Escape":

                        closeSlideshow();

                        break;

                }

            }
        );


        /* ==========================================
           DOUBLE CLICK → FULLSCREEN
           ========================================== */


        document
            .getElementById(
                "slideshow"
            )
            .addEventListener(
                "dblclick",
                function() {


                    if (
                        !document.fullscreenElement
                    ) {

                        this
                            .requestFullscreen()
                            .catch(
                                () => {}
                            );

                    } else {

                        document
                            .exitFullscreen()
                            .catch(
                                () => {}
                            );

                    }

                }
            );


        /* ==========================================
           ESCAPE / FULLSCREEN
           ========================================== */


        document.addEventListener(
            "fullscreenchange",
            function() {


                /*
                 * Если пользователь вышел
                 * из fullscreen кнопкой браузера,
                 * само слайдшоу остаётся открытым.
                 */

            }
        );


        /* ==========================================
           HTML ESCAPE
           ========================================== */


        function escapeHtml(
            text
        ) {


            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                text;


            return div.innerHTML;

        }


        /* ==========================================
           ЗАПУСК
           ========================================== */


        loadPhotos();


    </script>


</body>

</html>
